{% extends 'cats/base.html' %}
{% load my_tags %} <!-- Загружаем наш кастомный тег -->

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="mb-4">{{ title }}</h2>

                    <!-- enctype="multipart/form-data" ОБЯЗАТЕЛЕН для загрузки фото! -->
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        <!-- Выводим поля формы красиво -->
                        {% for field in form %}
                            <div class="mb-3">
                                <label for="{{ field.id_for_label }}" class="form-label">
                                    {{ field.label }}
                                </label>
                                {{ field }}
                                {% if field.help_text %}
                                    <small class="form-text text-muted">{{ field.help_text }}</small>
                                {% endif %}
                                {% for error in field.errors %}
                                    <div class="invalid-feedback d-block">{{ error }}</div>
                                {% endfor %}
                            </div>
                        {% endfor %}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                {% if object %}Сохранить изменения{% else %}Добавить кошку{% endif %}
                            </button>
                            <a href="{% url 'cats:cats_list' %}" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
