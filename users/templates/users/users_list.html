{% extends 'cats/base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>{{ title }}</h2>
    <div class="row">
        {% for user in users_list %}
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm"> <!-- Добавил h-100 и shadow для красоты -->
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ user.get_full_name|default:user.email }}</h5>
                    <p class="card-text text-muted">Роль: {{ user.role }}</p>

                    <!-- ИСПРАВЛЕНО ИМЯ МАРШРУТА -->
                    <a href="{% url 'users:user_public_profile' user.pk %}"
                       class="btn btn-outline-primary btn-sm mt-auto">
                       Подробнее
                    </a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12"><p class="alert alert-info">Пользователей пока нет.</p></div>
        {% endfor %}
    </div>

    <div class="row mt-4">
        <div class="col-12">
            {% include 'cats/includes/inc_pagination.html' %}
        </div>
    </div>
</div>
{% endblock %}
