{% extends 'cats/base.html' %}
{% load user_tags %} <!-- Загружаем наш тег -->

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <!-- Аватарка через тег -->
                    <img src="{{ object.avatar|user_media }}"
                         class="rounded-circle mb-3"
                         alt="Avatar"
                         style="width: 150px; height: 150px; object-fit: cover;">

                    <h2>{{ object.first_name }} {{ object.last_name }}</h2>
                    <p class="text-muted">{{ object.email }}</p>

                    <hr>

                    <div class="row text-start">
                        <div class="col-md-6">
                            <p><strong>Телефон:</strong> {{ object.phone|default:"Не указан" }}</p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Telegram:</strong> {{ object.telegram|default:"Не указан" }}</p>
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-2 justify-content-center">
                        <a href="{% url 'users:user_update' %}" class="btn btn-warning">️ Редактировать профиль</a>
                        <a href="{% url 'users:user_logout' %}" class="btn btn-danger"> Выйти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
