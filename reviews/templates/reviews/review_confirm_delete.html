{% extends 'cats/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="alert alert-danger">
        <h4>Удалить отзыв "{{ object.title }}"?</h4>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'reviews:review_detail' object.slug %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
